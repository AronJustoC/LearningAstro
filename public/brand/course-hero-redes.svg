    <text x="1440" y="418" fill="#ffc83d" font-size="32" font-weight="700" text-anchor="middle">DB</text>
    <text x="1440" y="460" fill="#8b98a9" font-size="24" text-anchor="middle" font-family="JetBrains Mono, monospace">10.0.2.20</text>
