    <rect x="560" y="450" width="180" height="180" rx="22" fill="#101418" stroke="#ff7a3d" stroke-width="6"/>
    <text x="650" y="520" fill="#ff7a3d" font-size="34" font-weight="700" text-anchor="middle">LB</text>
    <text x="650" y="566" fill="#8b98a9" font-size="24" text-anchor="middle" font-family="JetBrains Mono, monospace">10.0.0.1</text>
    <text x="650" y="598" fill="#8b98a9" font-size="22" text-anchor="middle">balanceador</text>
  </g>

  <!-- servidores web -->
  <g>
    <rect x="920" y="230" width="200" height="180" rx="22" fill="#101418" stroke="#3ddc97" stroke-width="6"/>
    <text x="1020" y="300" fill="#3ddc97" font-size="32" font-weight="700" text-anchor="middle">WEB 1</text>
    <text x="1020" y="345" fill="#8b98a9" font-size="24" text-anchor="middle" font-family="JetBrains Mono, monospace">10.0.1.11</text>
    <text x="1020" y="377" fill="#8b98a9" font-size="22" text-anchor="middle">nginx</text>
  </g>
  <g>
    <rect x="920" y="450" width="200" height="180" rx="22" fill="#101418" stroke="#3ddc97" stroke-width="6"/>
    <text x="1020" y="520" fill="#3ddc97" font-size="32" font-weight="700" text-anchor="middle">WEB 2</text>
    <text x="1020" y="565" fill="#8b98a9" font-size="24" text-anchor="middle" font-family="JetBrains Mono, monospace">10.0.1.12</text>
    <text x="1020" y="597" fill="#8b98a9" font-size="22" text-anchor="middle">nginx</text>
  </g>
  <g>
    <rect x="920" y="670" width="200" height="180" rx="22" fill="#101418" stroke="#3ddc97" stroke-width="6"/>
    <text x="1020" y="740" fill="#3ddc97" font-size="32" font-weight="700" text-anchor="middle">WEB 3</text>
    <text x="1020" y="785" fill="#8b98a9" font-size="24" text-anchor="middle" font-family="JetBrains Mono, monospace">10.0.1.13</text>
    <text x="1020" y="817" fill="#8b98a9" font-size="22" text-anchor="middle">nginx</text>
  </g>

  <!-- base de datos -->
  <g>
