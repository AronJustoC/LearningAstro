<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Jost, sans-serif">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 L0 0 0 64" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b98a9"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#0b1220"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- conexiones -->
  <g fill="none" stroke="#8b98a9" stroke-width="4" marker-end="url(#flecha)">
    <path d="M400 540 L560 540"/>
    <path d="M740 500 C820 420 860 340 920 320"/>
    <path d="M740 540 L920 540"/>
    <path d="M740 580 C820 660 860 740 920 760"/>
    <path d="M1120 320 C1200 320 1240 420 1320 430"/>
    <path d="M1120 760 C1200 760 1240 680 1320 660"/>
  </g>
  <g fill="#f9fafb" font-size="26" font-weight="500" opacity="0.85">
    <text x="420" y="520">HTTPS 443</text>
    <text x="1150" y="400">:5432</text>
  </g>

  <!-- cliente -->
  <g>
    <rect x="200" y="450" width="200" height="180" rx="22" fill="#101418" stroke="#4aa8ff" stroke-width="6"/>
    <text x="300" y="520" fill="#4aa8ff" font-size="34" font-weight="700" text-anchor="middle">CLIENTE</text>
    <text x="300" y="566" fill="#8b98a9" font-size="24" text-anchor="middle" font-family="JetBrains Mono, monospace">203.0.113.10</text>
    <text x="300" y="598" fill="#8b98a9" font-size="22" text-anchor="middle">navegador</text>
  </g>

  <!-- balanceador -->
